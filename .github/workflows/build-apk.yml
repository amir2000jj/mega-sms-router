name: Build MSR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Unit tests (does not block the APK)
        run: gradle --no-daemon testDebugUnitTest
        continue-on-error: true

      - name: Lint (does not block the APK)
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" | tee apk-info.txt
          "$BT/apksigner" verify --print-certs "$APK" | tee -a apk-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: msr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-info.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msr-reports
          path: |
            app/build/reports/
            app/build/test-results/
