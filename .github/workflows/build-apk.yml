name: Build MSR APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
        continue-on-error: true

      - name: Run Android Lint
        run: gradle --no-daemon lintDebug
        continue-on-error: true

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK file was not generated!"
            exit 1
          fi

          ls -lh "$APK"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          "$BT/aapt2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion" | tee apk-info.txt

          "$BT/apksigner" verify --print-certs "$APK" | tee -a apk-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msr-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-info.txt

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msr-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
